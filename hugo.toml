baseurl = "http://www.modemn.github.io"
title = "Nikhil Modem"
theme = "hugo-coder"
languagecode = "en-uk"
defaultcontentlanguage = "en"


[pagination]
pagerSize = 20

[services]
[services.disqus]
shortname = "yourdiscussshortname"

[markup.highlight]
style = "github-dark"

[params]
  author = "Nikhil Modem"
  info = "Frontend developer and badminton enthusiast"
  description = "Nikhil Modem's personal website"
  keywords = "blog,developer,personal"
  avatarurl = "images/avatar.jpeg"

  faviconSVG = "/img/favicon.svg"
  favicon_32 = "/img/favicon-32x32.png"
  favicon_16 = "/img/favicon-16x16.png"

  since = 2025

  enableTwemoji = true

  colorScheme = "auto"
  hidecolorschemetoggle = false

  # customCSS = ["css/custom.css"]
  # customSCSS = ["scss/custom.scss"]
  # customJS = ["js/custom.js"]

[taxonomies]
  category = "categories"
  series = "series"
  tag = "tags"
  author = "authors"

